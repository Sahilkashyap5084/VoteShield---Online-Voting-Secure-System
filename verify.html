<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoteShield - Verify Email</title>
  <style>
    :root {
      --color-cream-50: rgba(255, 245, 235, 1);
      --color-cream-100: rgba(255, 250, 240, 1);
      --color-slate-900: rgba(19, 52, 59, 1);
      --color-slate-500: rgba(98, 108, 113, 1);
      --color-red-600: rgba(220, 38, 38, 1);
      --color-red-700: rgba(185, 28, 28, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-cream-50);
      color: var(--color-slate-900);
      line-height: 1.6;
    }

    /* Header */
    header {
      background-color: var(--color-cream-100);
      padding: 20px 0;
      border-bottom: 1px solid rgba(94, 82, 64, 0.15);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 600;
      color: var(--color-slate-900);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background-color: var(--color-slate-900);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--color-slate-900);
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--color-red-600);
    }

    .login-btn {
      background-color: var(--color-red-600);
      color: white;
      padding: 10px 28px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: var(--color-red-700);
    }

    /* Verification Section */
    .verify-container {
      max-width: 480px;
      margin: 80px auto;
      background: var(--color-cream-100);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .verify-container h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      color: var(--color-slate-900);
      margin-bottom: 10px;
    }

    .verify-container p {
      text-align: center;
      color: var(--color-slate-500);
      margin-bottom: 30px;
      font-size: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-slate-900);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      font-size: 15px;
      background-color: white;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-color: var(--color-red-600);
    }

    button {
      background-color: var(--color-red-600);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease;
      align-self: center;
      width: 100%;
    }

    button:hover {
      background-color: var(--color-red-700);
    }

    .note {
      text-align: center;
      color: var(--color-slate-500);
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .verify-container {
        margin: 40px 20px;
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <nav>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>VoteShield</span>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login" class="login-btn">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- Verification Section -->
  <section class="verify-container">
    <h2>Email Verification</h2>
    <p>We've sent a 6-digit verification code to your registered email address.</p>

    <form method="POST">
      <div>
        <label for="verification_code">Verification Code</label>
        <input type="text" id="verification_code" name="verification_code" placeholder="Enter your 6-digit code" required>
      </div>

      <button type="submit">Verify Email</button>
    </form>

    <p class="note">Didn’t receive a code? <a href="/register" style="color: var(--color-red-600); text-decoration: none;">Resend code</a></p>
  </section>

</body>
</html>
